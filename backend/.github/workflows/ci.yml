name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Deno unit tests
        run: make test

      - name: Deno check main entry
        run: deno check --config supabase/functions/deno.json --no-check src/main.ts
